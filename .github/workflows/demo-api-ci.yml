name: Demo API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/demo-api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/demo-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/demo-api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/demo-api
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/demo-api
        run: python -m pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/demo-api
          push: true
          tags: ghcr.io/khadijafair/devplatform-demo-api:${{ github.sha }}
